name: Scientific Verification & GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  rust-tests:
    name: Rust Research Suites (Phases 18-20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Phase 18 tests (Vías A, B, C core)
        run: cargo test --release --lib tests::phase18 -- --nocapture
      - name: Run Phase 19 tests (Chiral 4+1D, Adaptive FSS, Continuum/CFT)
        run: cargo test --release --lib tests::phase19 -- --nocapture
      - name: Run Phase 20 tests (Yee-4 S4 3D, Wang-Landau, 2-site TDVP & BKT)
        run: cargo test --release --lib tests::phase20 -- --nocapture

  python-independent-verification:
    name: Independent Python/SciPy Cross-Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy, SciPy, Matplotlib
        run: pip install numpy scipy matplotlib
      - name: Verify Pathway A (Mlodinow-Brun 6x6, SO(3) chi^2, Yee-4 S4)
        run: python scripts/verify_via_a_mlodinow_brun.py
      - name: Verify Pathway C (2-Flavor Schwinger sparse eigsh & Schrieffer-Wolff)
        run: python scripts/verify_via_c_schwinger_exact.py
      - name: Regenerate publication figures & LaTeX tables
        run: python scripts/generate_publication_assets.py

  wasm-build-and-pages:
    name: Build WASM SIMD & Prepare Interactive Lab
    runs-on: ubuntu-latest
    needs: [ rust-tests, python-independent-verification ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build WASM SIMD package
        run: wasm-pack build --target web --release
      - name: Syntax check generated JS glue
        run: node --check pkg/qca_spacetime_lab.js
      - name: Assemble GitHub Pages site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r pkg _site/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Deploy Interactive Lab to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: wasm-build-and-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
