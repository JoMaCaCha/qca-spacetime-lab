name: Scientific Verification & GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full_test_suite:
        description: "Run complete 195-test Rust library suite (otherwise runs fast Clippy + Phases 18-20)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      pages: ${{ steps.filter.outputs.pages }}
      full_rust: ${{ steps.filter.outputs.full_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify modified paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "pages=true" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.full_test_suite }}" = "true" ]; then
              echo "full_rust=true" >> "$GITHUB_OUTPUT"
            else
              echo "full_rust=false" >> "$GITHUB_OUTPUT"
            fi
            echo "Mode: workflow_dispatch (full_test_suite=${{ inputs.full_test_suite }})"
            exit 0
          fi

          echo "full_rust=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No valid base commit ($BASE); enabling all fast jobs."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "pages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          RUST=false
          PYTHON=false
          PAGES=false

          if printf '%s\n' "$CHANGED" | grep -Eq '^(src/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            RUST=true
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^(scripts/|requirements-ci\.txt$|src/|\.github/workflows/ci\.yml$)'; then
            PYTHON=true
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^(src/|Cargo\.(toml|lock)$|index\.html$|styles/|js/|\.github/workflows/ci\.yml$)'; then
            PAGES=true
          fi

          echo "rust=$RUST" >> "$GITHUB_OUTPUT"
          echo "python=$PYTHON" >> "$GITHUB_OUTPUT"
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "Detected -> rust=$RUST python=$PYTHON pages=$PAGES full_rust=false"

  rust-tests:
    name: Rust Clippy, CLI Check & Research Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint all Rust targets with clippy
        run: cargo clippy --locked --all-targets
      - name: Check native CLI binary (qsu_cli)
        run: cargo check --locked --bin qsu_cli
      - name: Run fast Rust research suites (Phases 18-20)
        if: needs.detect-changes.outputs.full_rust != 'true'
        run: |
          cargo test --release --locked --lib tests::phase18 -- --nocapture
          cargo test --release --locked --lib tests::phase19 -- --nocapture
          cargo test --release --locked --lib tests::phase20 -- --nocapture
      - name: Run full Rust library test suite (195 tests)
        if: needs.detect-changes.outputs.full_rust == 'true'
        run: cargo test --release --locked --lib

  python-independent-verification:
    name: Independent Python/SciPy Cross-Verification
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Python dependencies
        run: pip install -r requirements-ci.txt
      - name: Verify Pathway A (Mlodinow-Brun 6x6, SO(3) chi^2, Yee-4 S4)
        run: python scripts/verify_via_a_mlodinow_brun.py
      - name: Verify Pathway C (2-Flavor Schwinger sparse eigsh & Schrieffer-Wolff)
        run: python scripts/verify_via_c_schwinger_exact.py
      - name: Regenerate publication figures & LaTeX tables
        run: python scripts/generate_publication_assets.py

  wasm-build-and-pages:
    name: Build WASM SIMD & Prepare Interactive Lab
    runs-on: ubuntu-latest
    needs: [ detect-changes, rust-tests, python-independent-verification ]
    if: |
      always() &&
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.pages == 'true' &&
      (needs.rust-tests.result == 'success' || needs.rust-tests.result == 'skipped') &&
      (needs.python-independent-verification.result == 'success' || needs.python-independent-verification.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build WASM SIMD package
        run: wasm-pack build --target web --release
      - name: Syntax check frontend & generated JS modules
        run: node --check js/app.js && node --check js/worker.js && node --check pkg/qca_spacetime_lab.js
      - name: Node/WASM runtime smoke test
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { initSync, QuantumSpacetimeUniverse } from './pkg/qca_spacetime_lab.js';
            initSync({ module: readFileSync('./pkg/qca_spacetime_lab_bg.wasm') });
            const u = new QuantumSpacetimeUniverse(16, 16, 1, 0.25, 0.2, 1.0);
            u.step();
            const n = u.total_norm();
            u.free();
            if (!Number.isFinite(n)) {
              throw new Error('Non-finite norm from WASM smoke test: ' + n);
            }
            console.log('WASM runtime smoke test OK (total_norm=' + n + ')');
          "
      - name: Assemble GitHub Pages site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p _site/pkg
          cp index.html _site/
          cp -r styles _site/
          cp -r js _site/
          cp pkg/qca_spacetime_lab.js pkg/qca_spacetime_lab_bg.wasm _site/pkg/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Deploy Interactive Lab to GitHub Pages
    if: |
      needs.wasm-build-and-pages.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: wasm-build-and-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
